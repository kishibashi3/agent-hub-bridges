name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じ branch への新しい push が来たら 古い run を cancel する。 PR の手戻しが
# CI 詰まりを起こすのを 防ぐ (= agent-hub-sdk と同じ運用)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 全 extras を入れて lint / test を 1 度に回す (= M0 では stub 中心
      # なので 重くない)。 M2 以降 (slack-bolt 等) が入って重くなったら
      # extras を分割する。
      - name: Install (dev + all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest -v

  go-test:
    name: go test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bridge-tmux, bridge-codex2]
        # bridge-claude2 は goroutine を多用するので -race と go vet も回す
        # (issue #276)。既存 2 dir の設定は変えない。
        include:
          - dir: bridge-claude2
            strict: true
    steps:
      - uses: actions/checkout@v4

      # bridge-claude2 の go.mod は replace で ../../agent-hub-sdk/go を参照する
      # (README の Prerequisites 参照)。CI でも sibling の位置に SDK main を置く。
      - name: Checkout agent-hub-sdk (sibling)
        if: matrix.dir == 'bridge-claude2'
        run: git clone --depth 1 https://github.com/kishibashi3/agent-hub-sdk.git "$GITHUB_WORKSPACE/../agent-hub-sdk"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: go test
        working-directory: ${{ matrix.dir }}
        run: go test ${{ matrix.strict && '-race' || '' }} ./...

      - name: go vet
        if: matrix.strict
        working-directory: ${{ matrix.dir }}
        run: go vet ./...
