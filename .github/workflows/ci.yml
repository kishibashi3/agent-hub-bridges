name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じ branch への新しい push が来たら 古い run を cancel する。 PR の手戻しが
# CI 詰まりを起こすのを 防ぐ (= agent-hub-sdk と同じ運用)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 全 extras を入れて lint / test を 1 度に回す (= M0 では stub 中心
      # なので 重くない)。 M2 以降 (slack-bolt 等) が入って重くなったら
      # extras を分割する。
      - name: Install (dev + all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Pytest
        run: pytest -v

  go-test:
    name: go test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [bridge-tmux, bridge-codex2]
        # bridge-claude2 は goroutine を多用するので -race も回す
        # (issue #276)。go vet は全 dir で回す (issue #297)。
        include:
          - dir: bridge-claude2
            strict: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum

      - name: go test
        working-directory: ${{ matrix.dir }}
        run: go test ${{ matrix.strict && '-race' || '' }} ./...

      - name: go vet
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

  # agent-hub-sdk を require する Go module 間で SDK の版が揃っているかを
  # 検査する (issue #357)。1 module だけ上げ忘れても go-test は green の
  # まま通るため (#321 型の取り残し)。対象 module は script が go.mod を
  # 走査して拾う。
  go-sdk-version:
    name: go sdk version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge-claude2/go.mod
          cache: false

      - name: Check agent-hub-sdk version
        # 他 module の go 行が setup-go の版より新しくても、go mod edit に
        # toolchain を download させない (network 不要の前提を保つ。issue #365)。
        env:
          GOTOOLCHAIN: local
        run: scripts/check-sdk-version.sh
